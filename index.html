<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koło Losowania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15131d; --ink-2:#1b1927; --raised:#201d2c; --line:#302c40;
    --gold:#F5B841; --gold-2:#FFD98A; --gold-deep:#E19B1F;
    --cream:#F3EFE9; --muted:#9a92a8;
    --font-d:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-b:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--font-b); color:var(--cream);
    background:
      radial-gradient(1100px 620px at 50% -12%, #241d34 0%, rgba(36,29,52,0) 60%),
      var(--ink);
    background-attachment:fixed; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }

  .app{ max-width:640px; margin:0 auto; padding:36px 22px 64px; }

  .masthead{ text-align:center; margin-bottom:18px; }
  .logo{ font-family:var(--font-d); font-weight:900; line-height:1; font-size:clamp(32px,6vw,50px); letter-spacing:-0.015em; }
  .logo em{ font-style:normal; color:var(--gold); }
  .tag{ color:var(--muted); font-size:13px; margin-top:8px; }

  .banner{ display:none; max-width:540px; margin:0 auto 20px; font-size:13px; line-height:1.5; text-align:center; color:var(--muted); background:var(--ink-2); border:1px solid var(--line); border-radius:11px; padding:11px 15px; }
  .banner.show{ display:block; }
  .banner.err{ color:#ffe0b8; border-color:rgba(245,184,65,.42); background:rgba(245,184,65,.09); }
  .banner code{ font-size:12px; background:var(--ink); border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--cream); }

  .toolbar{ margin-bottom:22px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .filter{ display:inline-flex; flex-wrap:wrap; justify-content:center; max-width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:4px; gap:3px; }
  .filter button{ font:inherit; font-weight:600; font-size:13.5px; color:var(--muted); background:transparent; border:none; border-radius:999px; padding:8px 15px; cursor:pointer; transition:.15s ease; white-space:nowrap; }
  .filter button:hover:not(.active){ color:var(--cream); }
  .filter button.active{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#3a2600; }
  .filter .cnt{ font-weight:600; opacity:.6; font-size:12px; }
  .filter button.active .cnt{ opacity:.8; }

  .wheel-col{ display:flex; flex-direction:column; align-items:center; gap:24px; }
  .wheel-wrap{ position:relative; width:min(560px,90vw); aspect-ratio:1; }
  .wheel-wrap canvas{ width:100%; height:100%; display:block; filter:drop-shadow(0 26px 54px rgba(0,0,0,.55)); }

  .pointer{
    position:absolute; top:-3px; left:50%; z-index:3; width:0; height:0;
    border-left:15px solid transparent; border-right:15px solid transparent; border-top:27px solid var(--gold);
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.55)); transform:translateX(-50%); transform-origin:50% 0;
  }
  .pointer.tick{ animation:tick .17s ease; }
  @keyframes tick{ 0%{transform:translateX(-50%) rotate(0);} 40%{transform:translateX(-50%) rotate(-12deg);} 100%{transform:translateX(-50%) rotate(0);} }

  .hub{
    position:absolute; top:50%; left:50%; z-index:2; width:21%; aspect-ratio:1; border-radius:50%; border:none; cursor:pointer;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 32% 27%, var(--gold-2), var(--gold) 55%, var(--gold-deep));
    color:#3a2600; font-family:var(--font-d); font-weight:900; text-transform:uppercase; font-size:clamp(12px,2.6vw,17px); letter-spacing:.02em;
    box-shadow:0 0 0 4px #100e18,0 0 0 6px rgba(245,184,65,.32),0 10px 22px rgba(0,0,0,.5),inset 0 -4px 10px rgba(150,90,0,.4),inset 0 4px 8px rgba(255,255,255,.45);
    transition:transform .12s ease, filter .2s ease;
  }
  .hub:hover:not(:disabled){ transform:translate(-50%,-50%) scale(1.05); }
  .hub:active:not(:disabled){ transform:translate(-50%,-50%) scale(.96); }
  .hub:disabled{ cursor:default; filter:grayscale(.55) brightness(.78); }
  .hub.ready{ animation:hubpulse 2.4s ease-in-out infinite; }
  @keyframes hubpulse{
    0%,100%{ box-shadow:0 0 0 4px #100e18,0 0 0 6px rgba(245,184,65,.32),0 10px 22px rgba(0,0,0,.5),inset 0 -4px 10px rgba(150,90,0,.4),inset 0 4px 8px rgba(255,255,255,.45); }
    50%{ box-shadow:0 0 0 4px #100e18,0 0 0 11px rgba(245,184,65,.16),0 10px 26px rgba(0,0,0,.5),inset 0 -4px 10px rgba(150,90,0,.4),inset 0 4px 8px rgba(255,255,255,.45); }
  }

  .result{ font-size:14px; color:var(--muted); text-align:center; min-height:22px; }
  .result strong{ color:var(--gold); font-weight:700; }

  .btn{ font:inherit; font-weight:600; border:none; border-radius:9px; padding:9px 14px; cursor:pointer; transition:.15s ease; }
  .btn-gold{ background:linear-gradient(180deg,var(--gold-2),var(--gold)); color:#3a2600; }
  .btn-gold:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-ghost:hover:not(:disabled){ color:var(--cream); border-color:var(--muted); }

  .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px; z-index:50; }
  .modal.open{ display:flex; }
  .modal-back{ position:absolute; inset:0; background:rgba(9,7,14,.72); backdrop-filter:blur(6px); }
  .modal-card{ position:relative; z-index:1; width:min(420px,100%); text-align:center; background:linear-gradient(180deg,var(--raised),var(--ink-2)); border:1px solid var(--line); border-radius:22px; padding:30px 26px 26px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:pop .3s cubic-bezier(.2,1.2,.3,1); }
  @keyframes pop{ from{ transform:scale(.9); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .m-eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .m-media{ width:150px; height:150px; margin:16px auto 14px; border-radius:50%; overflow:hidden; display:grid; place-items:center; color:#2a1c00; font-family:var(--font-d); font-weight:900; font-size:34px; box-shadow:0 0 0 4px rgba(245,184,65,.9), 0 0 0 10px rgba(245,184,65,.2), 0 14px 30px rgba(0,0,0,.5); }
  .m-media img{ width:100%; height:100%; object-fit:cover; }
  .m-name{ font-family:var(--font-d); font-weight:900; font-size:26px; margin:4px 0 6px; word-break:break-word; }
  .m-chance{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  .m-actions{ display:flex; gap:9px; }
  .m-actions .btn{ flex:1; padding:12px; font-size:15px; }

  .confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:60; opacity:0; transition:opacity .3s; }

  @media (prefers-reduced-motion: reduce){ .hub.ready, .pointer.tick, .modal-card{ animation:none; } }
</style>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="logo">Koło <em>Losowania</em></div>
      <div class="tag">Lista pochodzi z pliku data.json</div>
    </header>

    <div class="banner" id="banner"></div>

    <div class="toolbar">
      <div class="filter" id="filterSugar" role="group" aria-label="Filtr cukru">
        <button type="button" data-d="sugar" data-f="all" class="active">Mix <span class="cnt"></span></button>
        <button type="button" data-d="sugar" data-f="nosugar">Bez cukru <span class="cnt"></span></button>
        <button type="button" data-d="sugar" data-f="sugar">Z cukrem <span class="cnt"></span></button>
      </div>
      <div class="filter" id="filterBrand" role="group" aria-label="Filtr marki">
        <button type="button" data-d="brand" data-f="all" class="active">Wszystkie <span class="cnt"></span></button>
        <button type="button" data-d="brand" data-f="monster">Monster <span class="cnt"></span></button>
        <button type="button" data-d="brand" data-f="wkdzik">WK DZIK <span class="cnt"></span></button>
        <button type="button" data-d="brand" data-f="wkdzik_nc">WK DZIK bez kofeiny <span class="cnt"></span></button>
      </div>
    </div>

    <main class="wheel-col">
      <div class="wheel-wrap">
        <div class="pointer" id="pointer"></div>
        <canvas id="wheel"></canvas>
        <button class="hub" id="hub" disabled>Zakręć</button>
      </div>
      <div class="result" id="result">Wczytywanie…</div>
    </main>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
    <div class="modal-back" id="modalBack"></div>
    <div class="modal-card">
      <div class="m-eyebrow">Wylosowano</div>
      <div class="m-media" id="mMedia"></div>
      <div class="m-name" id="mName">—</div>
      <div class="m-chance" id="mChance"></div>
      <div class="m-actions">
        <button class="btn btn-ghost" id="closeBtn">Zamknij</button>
        <button class="btn btn-gold" id="againBtn">Zakręć ponownie</button>
      </div>
    </div>
  </div>

  <canvas class="confetti-canvas" id="confetti"></canvas>

<script>
(function(){
  "use strict";

  // Skąd czytać listę. Domyślnie data.json obok index.html.
  // Można nadpisać przez ?data=inny.json albo pełny URL (np. raw.githubusercontent.com).
  var DATA_URL = 'data.json';
  try{ var qp = new URLSearchParams(location.search); if(qp.get('data')) DATA_URL = qp.get('data'); }catch(e){}

  // Filtry: cukier (all|nosugar|sugar) i marka (all|monster|wkdzik|wkdzik_nc).
  // Można ustawić przez ?sugar=nosugar&brand=wkdzik
  var fSugar = 'all', fBrand = 'all';
  try{
    if(qp && qp.get){
      var _s = String(qp.get('sugar') || qp.get('filter') || '').toLowerCase();
      fSugar = (_s === 'sugar') ? 'sugar' : ((_s === 'nosugar' || _s === 'no-sugar') ? 'nosugar' : 'all');
      var _b = String(qp.get('brand') || '').toLowerCase();
      fBrand = (_b === 'monster') ? 'monster' : ((_b === 'wkdzik' || _b === 'dzik') ? 'wkdzik' : ((_b === 'wkdzik_nc' || _b === 'wkdzik-nc' || _b === 'dzik_nc') ? 'wkdzik_nc' : 'all'));
    }
  }catch(e){}

  var SIZE = 560;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  canvas.width = SIZE * DPR;
  canvas.height = SIZE * DPR;

  var CENTER = SIZE / 2;
  var RADIUS = SIZE / 2 - 6;
  var HUB_DISC = 68;

  var PALETTE = ['#FF5D73','#FFB020','#21C1A6','#5B8CFF','#C77DFF','#FF8FB1','#34D399','#FB923C','#F472B6','#38BDF8','#A78BFA','#F59E0B'];
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var entries = [];
  var allEntries = [];
  var rotation = 0;
  var spinning = false;
  var lastTopIndex = -1;
  var highlightIndex = -1;
  var lastWinnerName = null;
  var status = 'loading';   // loading | ok | demo
  var lastOverflow = false;

  var hub = document.getElementById('hub');
  var pointerEl = document.getElementById('pointer');
  var resultEl = document.getElementById('result');
  var banner = document.getElementById('banner');
  var modal = document.getElementById('modal');

  // ---------- helpers ----------
  function colorFor(i){ return PALETTE[i % PALETTE.length]; }
  function reassignColors(){ var p = 0; for(var i=0;i<entries.length;i++){ if(entries[i].customColor){ entries[i].color = entries[i].customColor; } else { entries[i].color = colorFor(p++); } } }
  function displayName(e){ if(e.label) return e.label; return e.image ? ('Zdjęcie ' + e.photoNo) : ('#'); }
  function truncate(s, n){ return s.length > n ? s.slice(0, n-1) + '…' : s; }
  function clampPct(v){ if(v < 0) return 0; if(v > 100) return 100; return v; }
  function fmtPct(p){ var v = (p < 1) ? Math.round(p*100)/100 : Math.round(p*10)/10; return String(v); }
  function isHexColor(c){ return typeof c === 'string' && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c); }
  function hexToRgb(h){ h = h.replace('#',''); if(h.length===3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; return [parseInt(h.slice(0,2),16)||0, parseInt(h.slice(2,4),16)||0, parseInt(h.slice(4,6),16)||0]; }
  function textOn(color){ var c = isHexColor(color) ? color : '#8a8a8a'; var r = hexToRgb(c); var L = 0.299*r[0] + 0.587*r[1] + 0.114*r[2]; return L > 150 ? '#1a1020' : '#FBF7F0'; }
  function parseTags(d){
    var raw = [];
    if(Array.isArray(d.tags)) raw = raw.concat(d.tags);
    else if(typeof d.tags === 'string') raw = raw.concat(d.tags.split(/[\s,]+/));
    if(Array.isArray(d.tag)) raw = raw.concat(d.tag);
    else if(typeof d.tag === 'string') raw = raw.concat(d.tag.split(/[\s,]+/));
    var set = {};
    for(var i=0;i<raw.length;i++){
      var t = String(raw[i]).toLowerCase().trim();
      if(!t) continue;
      if(t === 'no-sugar' || t === 'bezcukru' || t === 'zerocukru' || t === 'zero-sugar') t = 'nosugar';
      else if(t === 'cukier' || t === 'cukr' || t === 'zcukrem') t = 'sugar';
      else if(t === 'monster-energy' || t === 'monsterenergy') t = 'monster';
      else if(t === 'dzik' || t === 'wk-dzik' || t === 'wkdzik-energy') t = 'wkdzik';
      else if(t === 'no-caffeine' || t === 'bezkofeiny' || t === 'zerokofeiny' || t === 'bez-kofeiny' || t === 'nokofeina') t = 'nocaffeine';
      set[t] = true;
    }
    return set;
  }

  // ---------- load data.json ----------
  function loadData(){
    status = 'loading'; render();
    var sep = DATA_URL.indexOf('?') >= 0 ? '&' : '?';
    fetch(DATA_URL + sep + 't=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data){ status = 'ok'; hideBanner(); ingest(data); })
      .catch(function(err){
        status = 'demo';
        ingest({ entries: [ {label:'Przykład 1'}, {label:'Przykład 2'}, {label:'Przykład 3'}, {label:'Przykład 4'} ] });
        showBanner('Nie wczytano <code>' + DATA_URL + '</code> (' + (err && err.message ? err.message : 'błąd') + '). Pokazuję dane demo. Otwórz stronę przez http (GitHub Pages), nie z dysku, i wgraj plik obok index.html.', true);
      });
  }

  function ingest(data){
    var list = Array.isArray(data) ? data : (data && data.entries) || [];
    var title = (data && data.title) ? data.title : null;
    if(title) setTitle(title);
    allEntries = [];
    var photoNo = 0;
    list.forEach(function(d, idx){
      if(typeof d === 'string') d = { label: d };
      if(!d || typeof d !== 'object') return;
      var hasImg = !!d.image;
      var pct = (d.percent != null ? d.percent : (d.pct != null ? d.pct : null));
      var e = {
        id: idx + 1, image: null, src: d.image || null,
        label: (d.label != null ? String(d.label) : ''), color: '#000',
        customColor: isHexColor(d.color) ? d.color : null,
        tags: parseTags(d),
        photoNo: hasImg ? (++photoNo) : 0,
        fixedPct: (typeof pct === 'number' && !isNaN(pct)) ? clampPct(pct) : null,
        _pct: 0
      };
      if(hasImg){
        var img = new Image();
        img.onload = function(){ drawWheel(); };
        img.onerror = function(){ e.image = null; drawWheel(); }; // brak pliku -> pokaż etykietę
        img.src = d.image;
        e.image = img;
      }
      allEntries.push(e);
    });
    applyFilter();
  }

  function setTitle(t){ try{ document.title = t; }catch(e){} var logo = document.querySelector('.logo'); if(logo) logo.textContent = t; }
  function showBanner(html, isError){ banner.innerHTML = html; banner.className = 'banner show' + (isError ? ' err' : ''); }
  function hideBanner(){ banner.className = 'banner'; }
  function updateBanner(){
    if(status === 'loading'){ hideBanner(); return; }
    if(status === 'demo'){ return; } // demo banner już ustawiony
    if(entries.length < 2){ showBanner('W <code>data.json</code> jest mniej niż 2 pozycje — dodaj więcej, żeby losować.', false); return; }
    if(lastOverflow){ showBanner('Procenty w <code>data.json</code> przekraczają 100% — część pozycji ma 0% szans.', true); return; }
    hideBanner();
  }

  // ---------- filtry: cukier + marka ----------
  var fBtns = [];
  function predSugar(e, v){ if(v === 'sugar') return !!e.tags.sugar; if(v === 'nosugar') return !!e.tags.nosugar; return true; }
  function predBrand(e, v){ if(v === 'monster') return !!e.tags.monster; if(v === 'wkdzik') return !!e.tags.wkdzik; if(v === 'wkdzik_nc') return !!e.tags.wkdzik && !!e.tags.nocaffeine; return true; }
  function initFilterUI(){
    fBtns = Array.prototype.slice.call(document.querySelectorAll('.filter button'));
    for(var i=0;i<fBtns.length;i++){
      (function(b){ b.addEventListener('click', function(){ setFilter(b.getAttribute('data-d'), b.getAttribute('data-f')); }); })(fBtns[i]);
    }
    updateFilterUI();
  }
  function setFilter(dim, value){
    if(spinning) return;
    if(dim === 'brand') fBrand = (value === 'monster' || value === 'wkdzik' || value === 'wkdzik_nc') ? value : 'all';
    else fSugar = (value === 'sugar' || value === 'nosugar') ? value : 'all';
    lastWinnerName = null;
    closeModal();
    applyFilter();
    syncUrl();
  }
  function applyFilter(){
    entries = allEntries.filter(function(e){ return predSugar(e, fSugar) && predBrand(e, fBrand); });
    reassignColors();
    render();
    updateFilterUI();
  }
  function countFor(dim, value){
    var n = 0;
    for(var i=0;i<allEntries.length;i++){
      var e = allEntries[i], okS, okB;
      if(dim === 'brand'){ okB = predBrand(e, value); okS = predSugar(e, fSugar); }
      else { okS = predSugar(e, value); okB = predBrand(e, fBrand); }
      if(okS && okB) n++;
    }
    return n;
  }
  function updateFilterUI(){
    for(var i=0;i<fBtns.length;i++){
      var b = fBtns[i], dim = b.getAttribute('data-d'), val = b.getAttribute('data-f');
      var cur = (dim === 'brand') ? fBrand : fSugar;
      b.classList.toggle('active', cur === val);
      var c = b.querySelector('.cnt');
      if(c) c.textContent = '(' + countFor(dim, val) + ')';
    }
  }
  function syncUrl(){
    try{
      var p = new URLSearchParams(location.search);
      p.delete('filter');
      if(fSugar === 'all') p.delete('sugar'); else p.set('sugar', fSugar);
      if(fBrand === 'all') p.delete('brand'); else p.set('brand', fBrand);
      var q = p.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
    }catch(e){}
  }

  // ---------- probability model ----------
  function computePercents(){
    var n = entries.length, i;
    if(n === 0) return false;
    var lockedSum = 0, autoCount = 0;
    for(i=0;i<n;i++){ if(entries[i].fixedPct != null) lockedSum += entries[i].fixedPct; else autoCount++; }
    var over = false;
    if(autoCount > 0){
      var remaining = 100 - lockedSum;
      if(remaining <= 0.00001){
        over = true;
        var scale = lockedSum > 0 ? 100/lockedSum : 0;
        for(i=0;i<n;i++){ entries[i]._pct = (entries[i].fixedPct != null) ? entries[i].fixedPct*scale : 0; }
      } else {
        var per = remaining/autoCount;
        for(i=0;i<n;i++){ entries[i]._pct = (entries[i].fixedPct != null) ? entries[i].fixedPct : per; }
      }
    } else {
      if(lockedSum <= 0){ for(i=0;i<n;i++) entries[i]._pct = 100/n; }
      else { var s = 100/lockedSum; for(i=0;i<n;i++) entries[i]._pct = entries[i].fixedPct*s; }
    }
    return over;
  }

  function buildSegs(){
    var n = entries.length, i, total = 0, segs = [], acc = 0;
    for(i=0;i<n;i++) total += Math.max(0, entries[i]._pct);
    if(total <= 0){ for(i=0;i<n;i++) segs.push({ i:i, a0:(i/n)*Math.PI*2, a1:((i+1)/n)*Math.PI*2 }); return segs; }
    for(i=0;i<n;i++){
      var frac = Math.max(0, entries[i]._pct)/total;
      var a0 = acc*Math.PI*2; acc += frac; var a1 = acc*Math.PI*2;
      segs.push({ i:i, a0:a0, a1:a1 });
    }
    return segs;
  }

  // ---------- drawing ----------
  function drawImageCover(img, x, y, w, h){
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if(!iw || !ih) return;
    var scale = Math.max(w/iw, h/ih);
    var dw = iw*scale, dh = ih*scale;
    ctx.drawImage(img, x + (w-dw)/2, y + (h-dh)/2, dw, dh);
  }

  function centerText(main, sub){
    ctx.beginPath(); ctx.arc(CENTER,CENTER,RADIUS-8,0,Math.PI*2);
    ctx.setLineDash([8,10]); ctx.lineWidth=2; ctx.strokeStyle='rgba(243,239,233,0.22)'; ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(243,239,233,0.55)'; ctx.font='600 18px "Inter", system-ui, sans-serif'; ctx.fillText(main, CENTER, CENTER-8);
    if(sub){ ctx.fillStyle='rgba(243,239,233,0.32)'; ctx.font='400 13px "Inter", system-ui, sans-serif'; ctx.fillText(sub, CENTER, CENTER+16); }
  }

  function drawWheel(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,SIZE,SIZE);
    ctx.beginPath(); ctx.arc(CENTER,CENTER,RADIUS+3,0,Math.PI*2); ctx.fillStyle='#0e0c15'; ctx.fill();

    var n = entries.length;
    if(status === 'loading' && n === 0){ centerText('Wczytywanie…', ''); drawHubDisc(); return; }
    if(n === 0){ centerText('Brak pozycji', 'Uzupełnij data.json'); drawHubDisc(); return; }

    var segs = buildSegs();
    var i, s, e, start, end, mid, arc;

    for(i=0;i<segs.length;i++){
      s = segs[i]; e = entries[s.i];
      start = rotation + s.a0; end = rotation + s.a1;
      if(end - start <= 0.00001) continue;
      ctx.beginPath(); ctx.moveTo(CENTER,CENTER); ctx.arc(CENTER,CENTER,RADIUS,start,end); ctx.closePath();
      ctx.fillStyle = e.color; ctx.fill();
      if(s.i === highlightIndex){ ctx.lineWidth=5; ctx.strokeStyle='#FFF4D6'; }
      else { ctx.lineWidth=2; ctx.strokeStyle='rgba(14,12,21,0.5)'; }
      ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(CENTER,CENTER,RADIUS,0,Math.PI*2); ctx.lineWidth=6; ctx.strokeStyle='#0e0c15'; ctx.stroke();
    ctx.beginPath(); ctx.arc(CENTER,CENTER,RADIUS-1,0,Math.PI*2); ctx.lineWidth=2; ctx.strokeStyle='rgba(245,184,65,0.5)'; ctx.stroke();

    var imgR = HUB_DISC + (RADIUS-HUB_DISC)*0.54;
    for(i=0;i<segs.length;i++){
      s = segs[i]; e = entries[s.i]; arc = s.a1 - s.a0;
      if(arc <= 0.00001) continue;
      mid = rotation + (s.a0 + s.a1)/2;
      var avail = 2*imgR*Math.sin(Math.min(arc, Math.PI)/2);
      if(avail < 22) continue;
      var d = Math.min(avail*0.86, (RADIUS-HUB_DISC)*0.6);
      ctx.save();
      ctx.translate(CENTER,CENTER); ctx.rotate(mid);
      if(e.image && (e.image.naturalWidth || e.image.width)){
        ctx.translate(imgR,0); ctx.rotate(Math.PI/2);
        ctx.save(); ctx.beginPath(); ctx.arc(0,0,d/2,0,Math.PI*2); ctx.closePath(); ctx.clip();
        drawImageCover(e.image, -d/2, -d/2, d, d); ctx.restore();
        ctx.beginPath(); ctx.arc(0,0,d/2,0,Math.PI*2); ctx.lineWidth=Math.max(2,d*0.06); ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.stroke();
      } else {
        ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillStyle=textOn(e.color);
        var fs = Math.max(12, Math.min(20, d*0.5));
        ctx.font='600 '+fs+'px "Inter", system-ui, sans-serif';
        ctx.fillText(truncate(e.label || ('#'+(s.i+1)), 14), RADIUS-18, 0);
      }
      ctx.restore();
    }
    drawHubDisc();
  }

  function drawHubDisc(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.beginPath(); ctx.arc(CENTER,CENTER,HUB_DISC,0,Math.PI*2); ctx.fillStyle='#100e18'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='rgba(245,184,65,0.85)'; ctx.stroke();
  }

  // ---------- winner ----------
  function getWinnerIndex(){
    var n = entries.length; if(n === 0) return -1;
    var segs = buildSegs();
    var a = (-Math.PI/2 - rotation) % (Math.PI*2);
    if(a < 0) a += Math.PI*2;
    for(var k=0;k<segs.length;k++){ if(a >= segs[k].a0 && a < segs[k].a1) return segs[k].i; }
    return segs[segs.length-1].i;
  }

  function spin(){
    if(spinning || entries.length < 2 || status === 'loading') return;
    closeModal();
    highlightIndex = -1;
    spinning = true;
    lastTopIndex = getWinnerIndex();
    updateMeta();

    var turns = 6 + Math.random()*3;
    var from = rotation;
    var delta = turns*Math.PI*2 + Math.random()*Math.PI*2;
    var duration = reduceMotion ? 1200 : (4800 + Math.random()*800);
    var t0 = performance.now();

    function frame(now){
      var p = Math.min((now - t0)/duration, 1);
      var eased = 1 - Math.pow(1 - p, 4);
      rotation = from + delta*eased;
      drawWheel(); checkTick();
      if(p < 1){ requestAnimationFrame(frame); }
      else { spinning = false; rotation = rotation % (Math.PI*2); showWinner(getWinnerIndex()); updateMeta(); }
    }
    requestAnimationFrame(frame);
  }

  function checkTick(){
    var idx = getWinnerIndex();
    if(idx !== lastTopIndex){
      lastTopIndex = idx;
      if(!reduceMotion){ pointerEl.classList.remove('tick'); void pointerEl.offsetWidth; pointerEl.classList.add('tick'); }
    }
  }

  function showWinner(i){
    var e = entries[i]; if(!e) return;
    highlightIndex = i; drawWheel();
    var media = document.getElementById('mMedia');
    media.innerHTML = '';
    if(e.image && (e.image.naturalWidth || e.image.width)){ var im = document.createElement('img'); im.src = e.src; im.alt=''; media.appendChild(im); media.style.background='transparent'; }
    else { media.style.background = e.color; media.style.color = textOn(e.color); media.textContent = (e.label || '?').slice(0,3).toUpperCase(); }
    document.getElementById('mName').textContent = displayName(e) || 'Zdjęcie';
    document.getElementById('mChance').textContent = 'Szansa: ' + fmtPct(e._pct) + '%';
    lastWinnerName = displayName(e) || 'Zdjęcie';
    modal.classList.add('open');
    if(!reduceMotion) confettiBurst();
  }

  function closeModal(){ modal.classList.remove('open'); highlightIndex = -1; drawWheel(); }

  // ---------- render ----------
  function render(){
    lastOverflow = computePercents();
    drawWheel();
    updateMeta();
    updateBanner();
  }

  function updateMeta(){
    var n = entries.length;
    hub.disabled = (status === 'loading') || spinning || n < 2;
    hub.classList.toggle('ready', n >= 2 && !spinning && status !== 'loading');
    if(spinning){ resultEl.textContent = 'Kręci się…'; return; }
    resultEl.innerHTML = '';
    if(status === 'loading'){ resultEl.textContent = 'Wczytywanie…'; return; }
    if(n === 0){ resultEl.textContent = 'Brak pozycji w data.json'; return; }
    if(n === 1){ resultEl.textContent = 'Za mało pozycji (min. 2)'; return; }
    if(lastWinnerName){ resultEl.appendChild(document.createTextNode('Ostatni wynik: ')); var st = document.createElement('strong'); st.textContent = lastWinnerName; resultEl.appendChild(st); return; }
    resultEl.textContent = 'Naciśnij ZAKRĘĆ (albo spację)';
  }

  // ---------- confetti ----------
  var cCanvas = document.getElementById('confetti');
  var cctx = cCanvas.getContext('2d');
  var confRAF = null;
  var CONF_COLORS = ['#F5B841','#FFD98A','#FF5D73','#21C1A6','#5B8CFF','#C77DFF','#34D399'];
  function confettiBurst(){
    cCanvas.width = window.innerWidth * DPR; cCanvas.height = window.innerHeight * DPR;
    cctx.setTransform(DPR,0,0,DPR,0,0); cCanvas.style.opacity = '1';
    var W = window.innerWidth, H = window.innerHeight, pieces = [], N = 150;
    for(var i=0;i<N;i++){
      pieces.push({ x: W/2 + (Math.random()-0.5)*140, y: H*0.30, vx:(Math.random()-0.5)*11, vy:-6 - Math.random()*10,
        g:0.27 + Math.random()*0.13, s:6 + Math.random()*7, rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.4,
        c:CONF_COLORS[i % CONF_COLORS.length], life:0, max:130 + Math.random()*70, rect:Math.random()<0.55 });
    }
    if(confRAF) cancelAnimationFrame(confRAF);
    function step(){
      cctx.clearRect(0,0,W,H); var alive = false;
      for(var j=0;j<pieces.length;j++){
        var p = pieces[j]; p.life++; if(p.life > p.max) continue; alive = true;
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        var a = Math.max(0, 1 - p.life/p.max);
        cctx.save(); cctx.globalAlpha = a; cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle = p.c;
        if(p.rect){ cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); } else { cctx.beginPath(); cctx.arc(0,0,p.s/2,0,Math.PI*2); cctx.fill(); }
        cctx.restore();
      }
      if(alive){ confRAF = requestAnimationFrame(step); } else { cctx.clearRect(0,0,W,H); cCanvas.style.opacity = '0'; }
    }
    confRAF = requestAnimationFrame(step);
  }

  // ---------- events ----------
  hub.addEventListener('click', spin);
  canvas.addEventListener('click', function(){ if(!spinning) spin(); });
  document.getElementById('againBtn').addEventListener('click', function(){ closeModal(); spin(); });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  document.getElementById('modalBack').addEventListener('click', closeModal);
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); if(!spinning) spin(); }
    if(e.key === 'Escape') closeModal();
  });

  // ---------- init ----------
  initFilterUI();
  loadData();
})();
</script>
</body>
